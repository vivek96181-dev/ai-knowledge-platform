server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ai-knowledge-platform

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:ai-knowledge-platform-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.enterprise.aiknowledge.kafka"

  datasource:
    # 12-Factor Config: Environment variables with safe local defaults
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_knowledge_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Custom CORS configuration (allows frontend access)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT configuration — ALWAYS override JWT_SECRET with a strong random value in production!
# The default is only safe for local development. Never commit a real secret here.
jwt:
  secret: ${JWT_SECRET:insecure-local-dev-only-secret-key-minimum-32-chars!!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # 1 hour default

# File storage configuration
file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

# Kafka topic configuration
kafka:
  topic:
    document-uploaded: ${KAFKA_TOPIC_DOCUMENT_UPLOADED:document-uploaded}

# Document chunking configuration
chunking:
  target-size: ${CHUNKING_TARGET_SIZE:800}
  overlap-size: ${CHUNKING_OVERLAP_SIZE:150}



