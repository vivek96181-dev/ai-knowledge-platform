spring:
  application:
    name: ai-knowledge-platform-test

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # H2 dialect so Hibernate generates H2-compatible DDL (not PostgreSQL-specific SQL)
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        # Prevents conflicts with H2 reserved keywords (e.g. "user" is reserved in H2)
        globally_quoted_identifiers: true

server:
  port: 0

# Fixed JWT config for tests — safe to commit, only used with H2 in-memory test DB
jwt:
  secret: test-jwt-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-ok
  expiration-ms: 3600000

file:
  upload-dir: uploads-test

