spring:
  application:
    name: ai-knowledge-platform-test

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.enterprise.aiknowledge.kafka"

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # H2 dialect so Hibernate generates H2-compatible DDL (not PostgreSQL-specific SQL)
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        # Prevents conflicts with H2 reserved keywords (e.g. "user" is reserved in H2)
        globally_quoted_identifiers: true

server:
  port: 0

# Fixed JWT config for tests — safe to commit, only used with H2 in-memory test DB
jwt:
  secret: test-jwt-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-ok
  expiration-ms: 3600000

file:
  upload-dir: uploads-test

kafka:
  topic:
    document-uploaded: document-uploaded

chunking:
  target-size: 800
  overlap-size: 150

gemini:
  api-key: test-mock-api-key
  embedding:
    model: gemini-embedding-2
    dimensions: 768
    batch-size: 10
    max-retries: 3
    retry-delay-ms: 100
  generation:
    model: gemini-2.5-flash
    temperature: 0.2
    max-output-tokens: 1024
    max-context-characters: 8000
    max-retries: 3
    retry-delay-ms: 50

qdrant:
  host: localhost
  port: 6333
  grpc-port: 6334
  collection-name: document_chunks_test
  vector-dimensions: 768
  use-tls: false
  api-key: ""

search:
  default-top-k: 5
  max-top-k: 20
  fts:
    language: english
  hybrid:
    enabled: true
    rrf-k: 60
    semantic-weight: 1.0
    keyword-weight: 1.0
    semantic-candidates: 20
    keyword-candidates: 20
  reranking:
    enabled: true
    candidate-count: 20
    model: gemini-2.5-flash
    timeout-ms: 5000
    fallback-to-rrf: true

# Cache disabled in unit tests (no real Redis required)
cache:
  enabled: false
  key-version: v1
  search:
    ttl-seconds: 300
  rag:
    ttl-seconds: 600

# Disable Redis auto-configuration in tests
spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration



